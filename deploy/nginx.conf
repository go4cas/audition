# Audition's nginx site file (docs/RELEASE.md). deploy/install.sh renders it
# (domain, port and TLS lines filled in) into sites-available (or conf.d), so no
# shared nginx setting changes. Every name it defines starts with "audition".

# Requests that come through Cloudflare carry the visitor's address in
# CF-Connecting-IP. Only trust it from Cloudflare's own addresses
# (https://www.cloudflare.com/ips/), so nobody can fake it.
geo $audition_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map $audition_from_cloudflare $audition_client_ip {
    1 $http_cf_connecting_ip;
    default $remote_addr;
}
map $http_upgrade $audition_connection {
    default upgrade;
    "" close;
}

server {
    __TLS__
    server_name __DOMAIN__;
    client_max_body_size 50m;
    access_log /var/log/nginx/audition-access.log;

    # The app lives at /api/custom/app/ (TECH-SPEC Q2).
    location = / { return 302 /api/custom/app/; }

    # The Vaultbase admin (/_/) is not public: reach it through an SSH tunnel.
    location = /_/ready { proxy_pass http://127.0.0.1:__PORT__; }
    location ^~ /_/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $audition_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime run page (WebSocket at /realtime).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $audition_connection;
        proxy_read_timeout 1h;
    }
}
